<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Setting | Coast To Coast Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../admin/libs/all.min.css">

    <!-- Admin Styles -->
    <link rel="stylesheet" href="../../admin/css/admin.css">
    <link rel="icon" href="data:,">

    <style>
        /* ═══════════════════════════════════════
           Matching Screenshot UI
           ═══════════════════════════════════════ */
        
        .markup-header-banner {
            background: #000;
            color: #4df3c5; /* Cyan text from screenshot */
            text-align: center;
            padding: 1rem;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .markup-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0 10px;
        }

        .default-currency-sel {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
            color: #64748b;
        }

        .def-box {
            width: 40px;
            height: 35px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }

        .markup-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-cyan-light {
            background: #26c6da;
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-blue-dark {
            background: #3949ab;
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Table Styling matching screenshot */
        .currency-table-container {
            border: 1px solid #4db6ac;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
        }

        .currency-table {
            width: 100%;
            border-collapse: collapse;
        }

        .currency-table th {
            background: #ffffff;
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1e293b;
            border: 1px solid #e0f2f1;
            white-space: nowrap;
        }

        .currency-table td {
            padding: 1rem;
            border: 1px solid #e0f2f1;
            font-size: 0.9rem;
            color: #475569;
            vertical-align: middle;
        }

        .flag-img {
            width: 32px;
            height: 20px;
            object-fit: cover;
            border: 1px solid #f1f5f9;
        }

        .status-badge-active {
            background: #2e7d32;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .edit-btn {
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
            font-size: 1rem;
        }

        .edit-btn:hover {
            color: #000;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: #fff;
            width: 500px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #64748b;
            cursor: pointer;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-save {
            background: #ff5722;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .live-rates-card {
            width: 800px;
        }

        .live-rate-table {
            width: 100%;
            border-collapse: collapse;
        }

        .live-rate-table th {
            text-align: left;
            padding: 0.75rem;
            font-weight: 800;
            color: #000;
            border-bottom: 2px solid #e0f2f1;
        }

        .live-rate-table td {
            padding: 0.75rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .btn-update {
            background: #448aff;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-update-all {
            background: #ff5722;
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        .live-val {
            color: #2962ff;
            font-weight: 800;
        }
    </style>

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-XXXXXXXXXX');
    </script>
</head>

<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1 class="page-title">Manage Markup</h1>
                    </div>
                </div>

                <div class="header-right">
                    <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-right: 1.5rem;">
                        COAST TO COAST JOURNEYS
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <!-- Header Banner -->
                <div class="markup-header-banner">CURRENCY SETTING</div>

                <!-- Top Controls -->
                <div class="markup-top-bar">
                    <div class="default-currency-sel">
                        By Default Currency :-
                        <div class="def-box"></div>
                    </div>
                    
                    <div class="markup-actions">
                        <button class="btn-cyan-light" onclick="openAddModal()">Add Currency</button>
                        <button class="btn-blue-dark" onclick="openLiveRatesModal()">Live Rates</button>
                    </div>
                </div>

                <!-- Table -->
                <div class="currency-table-container">
                    <table class="currency-table" id="currencyTable">
                        <thead>
                            <tr>
                                <th style="width: 40px;">#</th>
                                <th>Country Name</th>
                                <th>Country Code</th>
                                <th>Flag</th>
                                <th>INR to Conversion Rate</th>
                                <th>Currency code</th>
                                <th>Status</th>
                                <th style="width: 60px;">Edit</th>
                            </tr>
                        </thead>
                        <tbody id="currencyBody">
                            <tr>
                                <td colspan="8" style="text-align: center; padding: 4rem;">
                                    <i class="fas fa-spinner fa-spin"></i> Fetching currency data...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Currency Modal -->
    <div class="modal-overlay" id="addCurrencyModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Add Currency</h2>
                <button class="close-modal" onclick="closeModal('addCurrencyModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Country Name</label>
                    <input type="text" id="newCountryName" class="form-control" style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">INR to Conversion Rate</label>
                    <input type="text" id="newConvRate" class="form-control" style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 4px;">
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Status</label>
                    <select id="newStatus" class="form-control" style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 4px; background: #fff;">
                        <option value="Active">Active</option>
                        <option value="In-Active">In-Active</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save" onclick="saveCurrency()">Save <i class="fas fa-save"></i></button>
            </div>
        </div>
    </div>

    <!-- Live Rates Modal -->
    <div class="modal-overlay" id="liveRatesModal">
        <div class="modal-card live-rates-card">
            <div class="modal-header">
                <h2 style="font-size: 2rem;">Live Currency Rates</h2>
                <button class="close-modal" onclick="closeModal('liveRatesModal')">&times;</button>
            </div>
            <div class="modal-body">
                <table class="live-rate-table">
                    <thead>
                        <tr>
                            <th>Country Name</th>
                            <th>Currency Code</th>
                            <th>Conversion Rate</th>
                            <th style="color: #2962ff;">Live Rate</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="liveRateBody">
                        <!-- Live rates load here -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="btn-update-all" onclick="updateAllLive()">Update All</button>
            </div>
        </div>
    </div>

    <!-- Admin JS -->
    <script src="../../admin/js/admin.js?v=2.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadCurrencies();
        });

        async function loadCurrencies() {
            const tbody = document.getElementById('currencyBody');
            try {
                const res = await apiRequest('/markup/currencies');

                if (res.success) {
                    const data = res.data;
                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem;">No currencies configured.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = data.map((c, index) => `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${c.country_name}</td>
                            <td>${c.country_code}</td>
                            <td>
                                <img src="${c.flag_url}" alt="${c.country_name}" class="flag-img">
                            </td>
                            <td>${parseFloat(c.conversion_rate).toFixed(2)}</td>
                            <td>${c.currency_code}</td>
                            <td>
                                <span class="status-badge-active" style="background: ${c.status === 'Active' ? '#2e7d32' : '#64748b'}">${c.status}</span>
                            </td>
                            <td>
                                <button class="edit-btn">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: red;">Failed to load currencies.</td></tr>';
            }
        }

        function openAddModal() {
            document.getElementById('addCurrencyModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function saveCurrency() {
            const data = {
                country_name: document.getElementById('newCountryName').value,
                conversion_rate: document.getElementById('newConvRate').value,
                status: document.getElementById('newStatus').value
            };

            const res = await apiRequest('/markup/currencies', 'POST', data);
            if (res.success) {
                showNotification('Currency added successfully');
                closeModal('addCurrencyModal');
                loadCurrencies();
            }
        }

        async function openLiveRatesModal() {
            const overlay = document.getElementById('liveRatesModal');
            const tbody = document.getElementById('liveRateBody');
            overlay.style.display = 'flex';
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:2rem;"><i class="fas fa-spinner fa-spin"></i> Fetching global rates...</td></tr>';

            try {
                const [liveRes, dbRes] = await Promise.all([
                    apiRequest('/markup/currencies/live'),
                    apiRequest('/markup/currencies')
                ]);

                if (liveRes.success && dbRes.success) {
                    const rates = liveRes.rates;
                    tbody.innerHTML = dbRes.data.map(c => {
                        const code = c.currency_code;
                        const live = rates[code] ? (1 / rates[code]).toFixed(2) : 'N/A';
                        return `
                            <tr>
                                <td>${c.country_name}</td>
                                <td>${c.currency_code}</td>
                                <td>${parseFloat(c.conversion_rate).toFixed(2)}</td>
                                <td class="live-val">${live}</td>
                                <td><button class="btn-update">Update</button></td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:red; text-align:center;">Failed to load live data</td></tr>';
            }
        }

        async function updateAllLive() {
            showNotification('Updating all currencies to live rates...', 'info');
            const res = await apiRequest('/markup/currencies/update-all', 'POST', {});
            if (res.success) {
                showNotification('All currencies updated successfully', 'success');
                loadCurrencies();
                closeModal('liveRatesModal');
            }
        }
    </script>
</body>

</html>
