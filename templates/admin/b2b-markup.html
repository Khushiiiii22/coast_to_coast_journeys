<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Markup Setting | Coast To Coast Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../admin/libs/all.min.css">

    <!-- Admin Styles -->
    <link rel="stylesheet" href="../../admin/css/admin.css">
    <link rel="icon" href="data:,">

    <style>
        .markup-section-banner {
            background: #000;
            color: #4df3c5;
            text-align: center;
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 2rem 0 1rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .markup-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 1px solid #4db6ac;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
            margin-bottom: 2rem;
        }

        .markup-col {
            border-right: 1px solid #e0f2f1;
        }

        .markup-col:last-child {
            border-right: none;
        }

        .col-header {
            padding: 0.75rem 1rem;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 1px solid #e0f2f1;
            font-size: 0.9rem;
        }

        .col-body {
            padding: 1.25rem 1rem;
            min-height: 80px;
        }

        .btn-group-sm {
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bg-cyan { background: #26c6da; }
        .bg-red { background: #e53935; }
        .bg-purple { background: #8e24aa; }
        .bg-teal { background: #009688; }

        .price-tag {
            border: 1px solid #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .dot-red { width: 6px; height: 6px; background: red; border-radius: 50%; }
    </style>

    <!-- Google tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-XXXXXXXXXX');
    </script>
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">B2B Markup Management</h1>
                </div>
                <div class="header-right">
                    <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-right: 1.5rem;">
                        COAST TO COAST JOURNEYS
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <div class="markup-section-banner" style="background: #000; color: #4df3c5; text-align: center; padding: 1rem; margin-bottom: 1rem;">
                    COAST TO COAST JOURNEYS-B2B - <i class="fas fa-hotel" style="margin: 0 5px;"></i> HOTEL MARKUP
                </div>
                
                <div style="text-align: right; margin-bottom: 15px;">
                    <button style="background: #26c6da; color: white; padding: 8px 20px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Add Hotel</button>
                </div>
                
                <div style="background: #fff; border: 1px solid #b2dfdb;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead style="background: #f1f8f8;">
                            <tr>
                                <th style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">Sr.</th>
                                <th style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">Group</th>
                                <th style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">Hotel Name</th>
                                <th style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">Markup Value</th>
                                <th style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">Status</th>
                                <th style="padding: 15px; border-bottom: 1px solid #b2dfdb;">Edit</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">1.</td>
                                <td style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb; font-weight: 700;">COAST TO COAST JOURNEYS-b2b</td>
                                <td style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">
                                    <span style="background: #03a9f4; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;">ALL HOTELS</span>
                                </td>
                                <td style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">
                                    <span style="border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; color: #475569;">250 F</span>
                                </td>
                                <td style="padding: 15px; border-bottom: 1px solid #b2dfdb; border-right: 1px solid #b2dfdb;">
                                    <span style="background: #4caf50; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;">Active</span>
                                </td>
                                <td style="padding: 15px; border-bottom: 1px solid #b2dfdb;">
                                    <div style="display: flex; gap: 8px; align-items: center;">
                                        <button style="background: #ff5722; color: white; padding: 4px 10px; border: none; border-radius: 4px; font-size: 0.75rem; cursor: pointer;">+ Add Markup</button>
                                        <i class="fas fa-pen" style="color: #475569; cursor: pointer; font-size: 0.9rem;"></i>
                                        <div style="background: #ff5722; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer;">
                                            <i class="fas fa-trash" style="color: white; font-size: 0.8rem;"></i>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../../admin/js/admin.js?v=2.0"></script>
</body>

</html>
