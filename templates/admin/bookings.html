<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Bookings | Coast To Coast Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../admin/libs/all.min.css">

    <!-- Admin Styles -->
    <link rel="stylesheet" href="../../admin/css/admin.css">
    <link rel="icon" href="data:,">

    <style>
        /* ═══════════════════════════════════════
           Matching Screenshot Layout & Colors
           ═══════════════════════════════════════ */
        
        :root {
            --mint-green: #2ecc71;
            --mint-light: rgba(46, 204, 113, 0.1);
            --border-muted: #e2e8f0;
            --text-muted: #64748b;
        }

        .booking-header-controls {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            padding: 1rem;
            background: #fff;
            border-bottom: 1px solid var(--border-muted);
            margin-bottom: 0;
            flex-wrap: wrap;
        }

        .ctrl-input {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-muted);
            border-radius: 4px;
            font-size: 0.9rem;
            color: #1e293b;
        }

        .ctrl-btn {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            border: 1px solid var(--border-muted);
            background: #fff;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: #f8fafc;
        }

        .btn-green {
            background: var(--mint-green);
            color: white;
            border-color: var(--mint-green);
        }

        .btn-green:hover {
            background: #27ae60;
        }

        .btn-cyan {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-container input {
            padding-right: 2.5rem;
            min-width: 250px;
        }

        .search-icon-btn {
            position: absolute;
            right: 1px;
            top: 1px;
            bottom: 1px;
            width: 38px;
            background: #ebf5ff;
            border: none;
            border-left: 1px solid var(--border-muted);
            color: #3b82f6;
            cursor: pointer;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        /* Table Styling matching screenshot */
        .ss-table-container {
            margin: 0;
            border: 1px solid #3498db;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
        }

        .ss-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .ss-table th {
            background: #f8fafc;
            padding: 0.75rem 1rem;
            text-align: center;
            font-weight: 700;
            color: #1e293b;
            border: 1px solid var(--border-muted);
            white-space: nowrap;
        }

        .ss-table td {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-muted);
            text-align: center;
            color: #475569;
        }

        .empty-row td {
            background: #fff;
            color: #94a3b8;
            padding: 2rem;
            font-style: italic;
        }

        /* Status colors */
        .st-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .st-confirmed { background: #d1fae5; color: #065f46; }
        .st-created { background: #dbeafe; color: #1e40af; }
        .st-failed { background: #fee2e2; color: #991b1b; }
        .st-cancelled { background: #f3f4f6; color: #374151; }

        .action-link {
            color: #3b82f6;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .sidebar-item.active-mint {
            background: var(--mint-green) !important;
            color: white !important;
        }

        .hotel-info-cell {
            text-align: left !important;
        }

        .highlight-blue {
            color: #0e64a6;
            font-weight: 600;
        }
    </style>

</head>

<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1 class="page-title">Hotel Bookings</h1>
                    </div>
                </div>

                <div class="header-right">
                    <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-right: 1.5rem;">
                        COAST TO COAST JOURNEYS
                    </div>
                </div>
            </header>

            <!-- Controls (Matching Screenshot top right) -->
            <div class="booking-header-controls">
                <input type="date" id="fromDate" class="ctrl-input" placeholder="From Date">
                <input type="date" id="toDate" class="ctrl-input" placeholder="To Date">
                
                <button class="ctrl-btn" onclick="resetFilters()">Show All</button>
                
                <div class="search-container">
                    <input type="text" id="bookingSearch" class="ctrl-input" placeholder="Enter Keyword">
                    <button class="search-icon-btn" onclick="loadBookings()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <button class="ctrl-btn btn-cyan" onclick="exportCSV()">
                    <i class="fas fa-download"></i> Export
                </button>
            </div>

            <div class="admin-content">
                <!-- Table (Matching Screenshot structure) -->
                <div class="ss-table-container">
                    <table class="ss-table" id="bookingsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Created On</th>
                                <th>Booking ID</th>
                                <th>Hotel Details</th>
                                <th>Booking CN</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                                <th>Total Nights</th>
                                <th>Guest Name</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsBody">
                            <tr class="empty-row">
                                <td colspan="12">
                                    <i class="fas fa-spinner fa-spin"></i> Fetching hotel data...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Footer style message -->
                <div style="display: flex; justify-content: space-between; margin-top: 2rem; padding: 1rem; color: #94a3b8; font-size: 0.75rem; border-top: 1px solid #f1f5f9;">
                    <div>© 2026 COAST TO COAST JOURNEYS . All Rights Reserved.</div>
                    <div>Developed & Maintained by <span style="color: #3b82f6;">COAST TO COAST JOURNEYS</span></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Admin JS -->
    <script src="../../admin/js/admin.js"></script>
    <script>
        let allBookings = [];

        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('status') === 'created') {
                document.querySelector('.page-title').textContent = 'Incomplete Bookings';
            }
            loadBookings();
        });

        async function loadBookings() {
            const tbody = document.getElementById('bookingsBody');
            const search = document.getElementById('bookingSearch').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;

            const urlParams = new URLSearchParams(window.location.search);
            const statusFilter = urlParams.get('status');
            const customerId = urlParams.get('customer_id');

            try {
                const params = new URLSearchParams({
                    limit: 100
                });

                if (statusFilter) params.append('status', statusFilter);
                if (customerId) params.append('customer_id', customerId);
                if (search) params.append('search', search);
                if (fromDate) params.append('from_date', fromDate);
                if (toDate) params.append('to_date', toDate);

                const res = await apiRequest(`/bookings?${params.toString()}`);

                if (res.success) {
                    allBookings = res.data;
                    renderTable(allBookings);
                }
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = '<tr><td colspan="12" style="color: red;">Failed to load data.</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('bookingsBody');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="12">No hotel bookings found</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((b, index) => {
                const createdOn = formatDate(b.created_at);
                const checkIn = b.check_in || '—';
                const checkOut = b.check_out || '—';
                const nights = calculateNights(b.check_in, b.check_out);
                const orderId = b.partner_order_id || b.id.substring(0, 8).toUpperCase();
                const bookingCN = b.etg_order_id || b.booking_id || '—';
                
                // Guest Info
                let guestName = b.customer_name || 'Guest';
                if (b.guests && Array.isArray(b.guests) && b.guests.length > 0) {
                    try {
                        const room = b.guests[0];
                        if (room.guests && room.guests.length > 0) {
                            const g = room.guests[0];
                            guestName = `${g.first_name || ''} ${g.last_name || ''}`.trim();
                        }
                    } catch (e) {}
                }

                const amount = `${b.currency || 'USD'} ${parseFloat(b.total_amount || 0).toLocaleString()}`;
                const status = b.status || 'unknown';
                const statusClass = `st-${status.toLowerCase()}`;

                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${createdOn}</td>
                        <td class="highlight-blue">${orderId}</td>
                        <td class="hotel-info-cell">
                            <strong>${b.hotel_name || 'N/A'}</strong><br>
                            <small>${b.hotel_city || ''}, ${b.hotel_country || ''}</small>
                        </td>
                        <td>${bookingCN}</td>
                        <td>${checkIn}</td>
                        <td>${checkOut}</td>
                        <td>${nights}</td>
                        <td>${guestName}</td>
                        <td style="font-weight: 700;">${amount}</td>
                        <td><span class="st-badge ${statusClass}">${status}</span></td>
                        <td>
                            <a href="booking-details.html?id=${b.id}" class="action-link">View Details</a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function calculateNights(inDate, outDate) {
            if (!inDate || !outDate) return 0;
            const ci = new Date(inDate);
            const co = new Date(outDate);
            const diff = Math.ceil((co - ci) / (1000 * 60 * 60 * 24));
            return diff > 0 ? diff : 0;
        }

        function resetFilters() {
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            document.getElementById('bookingSearch').value = '';
            loadBookings();
        }

        function exportCSV() {
            if (allBookings.length === 0) {
                showNotification('No data to export', 'warning');
                return;
            }
            exportToCSV(allBookings, 'hotel_bookings_report');
        }
    </script>
</body>

</html>
