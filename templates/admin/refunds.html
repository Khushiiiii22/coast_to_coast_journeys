<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refunds | Coast To Coast Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../admin/libs/all.min.css">

    <!-- Admin Styles -->
    <link rel="stylesheet" href="../../admin/css/admin.css">
    <link rel="icon" href="data:,">

    <style>
        .refund-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
        }

        .filter-input-sm {
            padding: 0.6rem;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-size: 0.9rem;
            width: 150px;
        }

        .search-input-group {
            display: flex;
            align-items: center;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 0 0.5rem;
        }

        .search-input-group input {
            border: none;
            padding: 0.6rem;
            outline: none;
            width: 180px;
        }

        .btn-icon-mint {
            background: #4db6ac;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-export-mint {
            background: #4db6ac;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Tabs */
        .refund-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .refund-tab {
            padding: 0.8rem 1.5rem;
            background: #64748b;
            color: white;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }

        .refund-tab.active {
            background: #f4511e;
        }

        /* Table */
        .refund-table-container {
            background: #fff;
            border: 1px solid #e0f2f1;
            border-radius: 8px;
            overflow-x: auto;
        }

        .inv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .inv-table th {
            background: #ffffff;
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 2px solid #e0f2f1;
            white-space: nowrap;
        }

        .empty-row {
            text-align: center;
            padding: 3rem !important;
            font-weight: 800;
            color: #ef4444; /* Red "No Booking Found" */
            font-size: 1.5rem;
            background: #fff5f5;
        }
    </style>

    <!-- Google tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Google tag (gtag.js) - Google Ads: AW-XXXXXXXXXX -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-XXXXXXXXXX');
    </script>
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Refunds</h1>
                </div>
                <div class="header-right">
                    <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-right: 1.5rem;">
                        COAST TO COAST JOURNEYS
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <!-- Toolbar -->
                <div class="refund-toolbar">
                    <input type="text" class="filter-input-sm" placeholder="From Date" onfocus="(this.type='date')">
                    <input type="text" class="filter-input-sm" placeholder="To Date" onfocus="(this.type='date')">
                    <div class="search-input-group">
                        <input type="text" placeholder="Enter Keyword">
                    </div>
                    <button class="btn-icon-mint"><i class="fas fa-search"></i></button>
                    <button class="btn-export-mint">Export</button>
                </div>

                <!-- Tabs -->
                <div class="refund-tabs">
                    <button class="refund-tab active">Online Hotels</button>
                    <button class="refund-tab">Offline Hotels</button>
                    <button class="refund-tab">FD Hotels</button>
                </div>

                <!-- Table -->
                <div class="refund-table-container">
                    <table class="inv-table">
                        <thead>
                            <tr>
                                <th>Booking Date</th>
                                <th>Hotel / Destination</th>
                                <th>Check-In Date</th>
                                <th>Passenger</th>
                                <th>Agent Details</th>
                                <th>Ref No</th>
                                <th>Statement</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="8" class="empty-row">No Booking Found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../../admin/js/admin.js"></script>
    <script>
        let allRefunds = [];

        document.addEventListener('DOMContentLoaded', async function () {
            const token = localStorage.getItem('admin_token');
            if (!token) { window.location.href = 'login.html'; return; }
            await loadRefunds();
        });

        async function loadRefunds() {
            const tbody = document.querySelector('.inv-table tbody');
            try {
                const res = await apiRequest('/refunds?limit=100');
                if (!res.success) throw new Error(res.error);

                allRefunds = res.data || [];

                if (allRefunds.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="empty-row">No Refunds Found</td></tr>';
                    return;
                }

                tbody.innerHTML = allRefunds.map(r => {
                    const bookingDate = r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN') : '—';
                    const checkIn = r.check_in ? new Date(r.check_in).toLocaleDateString('en-IN') : '—';
                    const amount = parseFloat(r.total_price) || 0;

                    return `
                        <tr>
                            <td>${bookingDate}</td>
                            <td>${r.hotel_name || '—'}</td>
                            <td>${checkIn}</td>
                            <td>${r.guest_name || '—'}</td>
                            <td>${r.guest_email || '—'}</td>
                            <td>${r.booking_id || '—'}</td>
                            <td>$${amount.toLocaleString('en-IN')}</td>
                            <td>
                                <button class="btn-icon-mint" onclick="window.location.href='booking-details.html?id=${r.booking_id}'" title="View">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('Failed to load refunds:', err);
                if (tbody) tbody.innerHTML = '<tr><td colspan="8" class="empty-row" style="color:#ef4444;">Failed to load refunds</td></tr>';
            }
        }
    </script>
</body>

</html>
