<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users | Coast To Coast Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../admin/libs/all.min.css">

    <!-- Admin Styles -->
    <link rel="stylesheet" href="../../admin/css/admin.css">
    <link rel="icon" href="data:,">

    <style>
        .filters-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: #64748b;
            white-space: nowrap;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.5rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-box input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 40px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0f2fe;
            color: #0e64a6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 500;
        }

        .user-email {
            font-size: 0.8rem;
            color: #64748b;
        }

        .role-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .role-super_admin {
            background: #fee2e2;
            color: #dc2626;
        }

        .role-admin {
            background: #fef3c7;
            color: #d97706;
        }

        .role-staff {
            background: #dcfce7;
            color: #16a34a;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }
    </style>

    <!-- Google tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Google tag (gtag.js) - Google Ads: AW-XXXXXXXXXX -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-XXXXXXXXXX');
    </script>
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Admin Users</h1>
                </div>

                <div class="header-right">
                    <button class="btn btn-primary" onclick="openModal('addUserModal')">
                        <i class="fas fa-plus"></i> Add Admin User
                    </button>
                </div>
            </header>

            <div class="admin-content">
                <!-- Filters -->
                <div class="filters-bar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="userSearch" placeholder="Search by name, email...">
                    </div>

                    <div class="filter-group">
                        <label>Role:</label>
                        <select id="roleFilter">
                            <option value="">All Roles</option>
                            <option value="super_admin">Super Admin</option>
                            <option value="admin">Admin</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="admin-card">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name & Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Joined Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersBody">
                            <tr>
                                <td colspan="5" style="text-align: center; padding: 2rem;">
                                    <i class="fas fa-spinner fa-spin"></i> Loading users...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add User Modal -->
    <div class="modal" id="addUserModal">
        <div class="modal-overlay" onclick="closeModal('addUserModal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-user-plus"></i> Add Admin User</h3>
                <button class="modal-close" onclick="closeModal('addUserModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addUserForm">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="admin@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-control">
                            <option value="staff">Staff</option>
                            <option value="admin">Admin</option>
                            <option value="super_admin">Super Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password (for new users)" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addUserModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveUser()">
                    <i class="fas fa-save"></i> Save User
                </button>
            </div>
        </div>
    </div>

    <!-- Admin JavaScript -->
    <script src="../../admin/js/admin.js?v=2.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadUsers();

            const searchInput = document.getElementById('userSearch');
            const roleFilter = document.getElementById('roleFilter');

            let timeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(loadUsers, 500);
            });

            roleFilter.addEventListener('change', loadUsers);
        });

        async function loadUsers() {
            const tbody = document.getElementById('usersBody');
            const search = document.getElementById('userSearch').value;
            const role = document.getElementById('roleFilter').value;

            try {
                const params = new URLSearchParams();
                if (search) params.append('search', search);
                if (role) params.append('role', role);

                const res = await apiRequest(`/users?${params.toString()}`);

                if (res.success) {
                    const users = res.data;
                    window.adminUsersData = users;
                    if (users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem;">No users found</td></tr>';
                        return;
                    }

                    tbody.innerHTML = users.map(user => `
                        <tr>
                            <td>
                                <div class="user-info">
                                    <div class="user-avatar">${user.full_name?.charAt(0) || 'U'}</div>
                                    <div class="user-details">
                                        <span class="user-name">${user.full_name || 'Unnamed'}</span>
                                        <span class="user-email">${user.email}</span>
                                    </div>
                                </div>
                            </td>
                            <td><span class="role-badge role-${user.role}">${user.role.replace('_', ' ')}</span></td>
                            <td><span class="status-badge ${user.is_active ? 'confirmed' : 'cancelled'}">${user.is_active ? 'Active' : 'Inactive'}</span></td>
                            <td>${new Date(user.created_at).toLocaleDateString()}</td>
                            <td>
                                <div class="action-btns">
                                    <button class="btn btn-secondary btn-icon" title="Edit" onclick="editUser('${user.id}')">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-secondary btn-icon" title="Delete" onclick="deleteUser('${user.id}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                } else if (res.error === 'Insufficient permissions') {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--status-error);">You do not have permission to view this page. Super Admin only.</td></tr>';
                }
            } catch (error) {
                console.error('Error loading users:', error);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--status-error);">Failed to load users</td></tr>';
            }
        }

        let editUserId = null;

        async function saveUser() {
            const form = document.getElementById('addUserForm');
            if (!validateForm('addUserForm')) return;

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                let res;
                if (editUserId) {
                    res = await apiRequest(`/users/${editUserId}`, 'PUT', data);
                } else {
                    res = await apiRequest('/users', 'POST', data);
                }
                
                if (res.success) {
                    showNotification(editUserId ? 'Admin user updated successfully' : 'Admin user added successfully', 'success');
                    closeModal('addUserModal');
                    form.reset();
                    editUserId = null;
                    document.querySelector('#addUserModal .modal-title').innerHTML = '<i class="fas fa-user-plus"></i> Add Admin User';
                    loadUsers();
                }
            } catch (error) {
                showNotification(error.message || 'Failed to save user', 'error');
            }
        }

        function editUser(id) {
            const user = window.adminUsersData.find(u => u.id === id);
            if (!user) return;
            
            editUserId = id;
            document.querySelector('#addUserModal .modal-title').innerHTML = '<i class="fas fa-user-edit"></i> Edit Admin User';
            
            const form = document.getElementById('addUserForm');
            form.elements['full_name'].value = user.full_name || '';
            form.elements['email'].value = user.email || '';
            form.elements['role'].value = user.role || 'staff';
            form.elements['password'].value = '';
            form.elements['password'].placeholder = 'Leave blank to keep current password';
            form.elements['password'].required = false;
            
            openModal('addUserModal');
        }

        // Reset modal on open if adding new
        const originalOpenModal = window.openModal;
        window.openModal = function(id) {
            if (id === 'addUserModal' && !editUserId) {
                document.getElementById('addUserForm').reset();
                document.getElementById('addUserForm').elements['password'].required = true;
                document.getElementById('addUserForm').elements['password'].placeholder = 'Enter password (for new users)';
                document.querySelector('#addUserModal .modal-title').innerHTML = '<i class="fas fa-user-plus"></i> Add Admin User';
            }
            if (originalOpenModal) originalOpenModal(id);
        };
        
        // Reset editUserId on close
        const originalCloseModal = window.closeModal;
        window.closeModal = function(id) {
            if (id === 'addUserModal') editUserId = null;
            if (originalCloseModal) originalCloseModal(id);
        };

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this admin user?')) return;
            try {
                const res = await apiRequest(`/users/${id}`, 'DELETE');
                if (res.success) {
                    showNotification('User deleted successfully', 'success');
                    loadUsers();
                }
            } catch (error) {
                showNotification(error.message || 'Failed to delete user', 'error');
            }
        }
    </script>
</body>

</html>
