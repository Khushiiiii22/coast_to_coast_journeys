name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to VPS via rsync
        run: rsync -e "ssh -o StrictHostKeyChecking=no" -avz --delete --exclude '.venv' --exclude 'venv' --exclude '__pycache__' --exclude '.git' --exclude 'node_modules' ./ root@2.24.196.78:/var/www/c2cjourneys/

      - name: Restart Backend Service
        run: ssh -o StrictHostKeyChecking=no root@2.24.196.78 "systemctl restart c2cjourneys"
